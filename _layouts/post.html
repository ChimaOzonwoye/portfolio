---
layout: default
---
<main id="top">
  <section class="wrap article-head">
    <h1>{{ page.title }}</h1>
    <p class="when"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y" }}</time></p>
  </section>
  <article class="wrap article">
    <div class="article-body">
      {{ content }}
    </div>
    <nav class="article-nav" aria-label="More posts">
      {% if page.previous.url %}
      <a class="inline" href="{{ page.previous.url | relative_url }}">← {{ page.previous.title }}</a>
      {% endif %}
      {% if page.next.url %}
      <a class="inline next" href="{{ page.next.url | relative_url }}">{{ page.next.title }} →</a>
      {% endif %}
    </nav>
    <p class="back"><a class="inline" href="{{ '/blog/' | relative_url }}">Back to all posts</a></p>
  </article>
</main>

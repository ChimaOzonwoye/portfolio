---
layout: default
---

<style>
    .post-header {
        text-align: center;
        margin-bottom: 2em;
        padding: 2em;
        background: var(--bg-secondary);
        border-radius: 15px;
        box-shadow: 0 2px 8px var(--shadow);
    }
    
    .post-title {
        font-size: 2.5em;
        margin-bottom: 0.3em;
        color: var(--accent);
        font-family: 'Times New Roman', Times, serif;
        line-height: 1.3;
    }
    
    .post-date {
        color: var(--text-tertiary);
        font-size: 1em;
        font-style: italic;
        margin-bottom: 1em;
    }
    
    .post-content {
        background: var(--bg-secondary);
        padding: 2.5em;
        border-radius: 15px;
        box-shadow: 0 2px 8px var(--shadow);
        margin-bottom: 2em;
        color: var(--text-primary);
        text-align: justify;
        line-height: 1.8;
    }
    
    .post-content p {
        margin-bottom: 1.5em;
    }
    
    .post-content p:last-child {
        margin-bottom: 0;
    }
    
    .post-navigation {
        display: flex;
        justify-content: space-between;
        margin-top: 3em;
        padding-top: 2em;
        border-top: 1px solid var(--border);
    }
    
    .post-nav-link {
        color: var(--accent);
        text-decoration: none;
        padding: 10px 20px;
        border: 1px solid var(--border);
        border-radius: 8px;
        transition: all 0.3s;
        background: var(--bg-secondary);
    }
    
    .post-nav-link:hover {
        background: var(--accent);
        color: white;
    }
    
    .back-to-blog {
        text-align: center;
        margin: 2em 0;
    }
    
    .back-to-blog a {
        color: var(--accent);
        text-decoration: none;
        font-size: 1.1em;
        padding: 10px 20px;
        border: 1px solid var(--accent);
        border-radius: 8px;
        transition: all 0.3s;
    }
    
    .back-to-blog a:hover {
        background: var(--accent);
        color: white;
    }
    
    @media (max-width: 600px) {
        .post-title {
            font-size: 2em;
        }
        
        .post-content {
            padding: 1.5em;
        }
        
        .post-navigation {
            flex-direction: column;
            gap: 1em;
        }
    }
</style>

<article class="post">
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%Y" }}
        </time>
    </header>
    
    <div class="post-content">
        {{ content }}
    </div>
</article>

<div class="back-to-blog">
    <a href="{{ site.baseurl }}/blog/">← Back to All Posts</a>
</div>

<nav class="post-navigation">
    {% if page.previous.url %}
        <a href="{{ page.previous.url | relative_url }}" class="post-nav-link">
            ← {{ page.previous.title }}
        </a>
    {% else %}
        <span></span>
    {% endif %}
    
    {% if page.next.url %}
        <a href="{{ page.next.url | relative_url }}" class="post-nav-link">
            {{ page.next.title }} →
        </a>
    {% else %}
        <span></span>
    {% endif %}
</nav>
